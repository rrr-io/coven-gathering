name: coven-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coven
      POSTGRES_USER: coven
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - coven-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coven -d coven"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  coven-dev-data:
