name: coven-gathering
services:
  db:
    image: postgres:16-alpine
    container_name: coven-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coven
      POSTGRES_USER: coven
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command: >
      postgres -c shared_buffers=32MB -c work_mem=2MB -c max_connections=20
    volumes:
      - coven-db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coven -d coven"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    image: eclipse-temurin:21-jre
    container_name: coven-backend
    restart: unless-stopped
    command:
      [
        "java",
        "-Xms32m",
        "-Xmx256m",
        "-XX:+UseSerialGC",
        "-jar",
        "/app/app.jar",
      ]
    environment:
      DB_URL: jdbc:postgresql://coven-db:5432/coven
      DB_USER: coven
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      APP_ORIGINS: ${APP_ORIGINS:-*}
      COOKIE_SECURE: "true"
      PROOFS_DIR: /data/proofs
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
    volumes:
      - ./app.jar:/app/app.jar:ro
      - coven-proofs:/data/proofs
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, web]
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
volumes:
  coven-db-data:
  coven-proofs:
networks:
  internal: {}
  web:
    external: true
